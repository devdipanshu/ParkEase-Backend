<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div style="text-align:center;margin-bottom:32px;">
        <div class="icon-box" style="margin:0 auto 16px;width:56px;height:56px;border-radius:16px;">
          <mat-icon style="font-size:1.6rem;width:1.6rem;height:1.6rem;">search</mat-icon>
        </div>
        <h2 style="font-size:1.7rem;font-weight:800;letter-spacing:-0.03em;color:var(--foreground);margin-bottom:8px;">
          Find Parking
        </h2>
        <p style="font-size:0.9rem;color:var(--muted-foreground);margin:0;">
          Search by city name or use your GPS location
        </p>
      </div>

      <!-- Mode toggle -->
      <div style="display:flex;background:var(--muted);border-radius:12px;padding:4px;margin-bottom:20px;">
        <button class="btn w-50"
          style="border-radius:9px;padding:8px;font-size:0.875rem;font-weight:600;transition:all 0.15s;"
          [style.background]="mode==='city' ? 'var(--card)' : 'transparent'"
          [style.color]="mode==='city' ? 'var(--foreground)' : 'var(--muted-foreground)'"
          [style.box-shadow]="mode==='city' ? '0 1px 4px rgba(0,0,0,0.3)' : 'none'"
          (click)="mode='city'">
          <mat-icon style="font-size:1rem;width:1rem;height:1rem;vertical-align:middle;margin-right:4px;">location_city</mat-icon>
          By City
        </button>
        <button class="btn w-50"
          style="border-radius:9px;padding:8px;font-size:0.875rem;font-weight:600;transition:all 0.15s;"
          [style.background]="mode==='nearby' ? 'var(--card)' : 'transparent'"
          [style.color]="mode==='nearby' ? 'var(--foreground)' : 'var(--muted-foreground)'"
          [style.box-shadow]="mode==='nearby' ? '0 1px 4px rgba(0,0,0,0.3)' : 'none'"
          (click)="mode='nearby'">
          <mat-icon style="font-size:1rem;width:1rem;height:1rem;vertical-align:middle;margin-right:4px;">my_location</mat-icon>
          Nearby
        </button>
      </div>

      <!-- City search -->
      <div class="feature-card" *ngIf="mode==='city'">
        <label style="font-weight:600;margin-bottom:8px;display:block;">City Name</label>
        <div style="display:flex;gap:10px;margin-bottom:12px;">
          <input type="text" class="form-control" [(ngModel)]="cityQuery"
            placeholder="e.g. Mumbai, Delhi, Bangalore"
            style="flex:1;"
            (keyup.enter)="onCitySearch()">
        </div>

        <div class="alert alert-danger" *ngIf="cityError" style="margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <mat-icon style="font-size:1rem;width:1rem;height:1rem;flex-shrink:0;">error_outline</mat-icon>
            {{cityError}}
          </div>
        </div>

        <button class="btn btn-dark-primary w-100" style="padding:12px;"
          (click)="onCitySearch()" [disabled]="citySearching">
          <span *ngIf="citySearching" class="spinner-border spinner-border-sm me-1"></span>
          <mat-icon *ngIf="!citySearching" style="font-size:1.1rem;width:1.1rem;height:1.1rem;">search</mat-icon>
          {{citySearching ? 'Finding location...' : 'Search in ' + (cityQuery || 'City')}}
        </button>
      </div>

      <!-- Nearby search -->
      <div class="feature-card" *ngIf="mode==='nearby'">
        <button class="btn btn-dark-primary w-100 mb-4"
                (click)="useMyLocation()" [disabled]="locating"
                style="padding:12px;">
          <mat-icon style="font-size:1.1rem;width:1.1rem;height:1.1rem;">my_location</mat-icon>
          {{ locating ? 'Getting your location...' : 'Use My Current Location' }}
        </button>

        <div class="divider">or enter manually</div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label>Latitude</label>
            <input type="number" step="0.0001" class="form-control"
                   [(ngModel)]="lat" placeholder="e.g. 28.5706">
          </div>
          <div class="col-6">
            <label>Longitude</label>
            <input type="number" step="0.0001" class="form-control"
                   [(ngModel)]="lng" placeholder="e.g. 77.3272">
          </div>
        </div>

        <div class="form-group mb-3">
          <label>Search Radius</label>
          <select class="form-select" [(ngModel)]="radius">
            <option value="1">1 km radius</option>
            <option value="2">2 km radius</option>
            <option value="5">5 km radius</option>
            <option value="10">10 km radius</option>
          </select>
        </div>

        <div class="alert alert-danger" *ngIf="locationError" style="margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <mat-icon style="font-size:1rem;width:1rem;height:1rem;flex-shrink:0;">error_outline</mat-icon>
            {{locationError}}
          </div>
        </div>

        <button class="btn btn-dark-primary w-100" style="padding:12px;"
                (click)="onNearbySearch()" [disabled]="!lat || !lng">
          <mat-icon style="font-size:1.1rem;width:1.1rem;height:1.1rem;">search</mat-icon>
          Search Nearby Lots
        </button>
      </div>

    </div>
  </div>
</div>
