<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="page-header">
        <h2>Add New Parking Lot</h2>
      </div>

      <div class="feature-card">
        <div class="alert alert-danger py-2 mb-3" *ngIf="errorMsg">{{errorMsg}}</div>

        <div class="row g-3">
          <div class="col-md-6">
            <label>Lot Name</label>
            <input type="text" class="form-control" [(ngModel)]="lot.name" placeholder="City Park Lot A">
          </div>
          <div class="col-md-6">
            <label>City</label>
            <input type="text" class="form-control" [(ngModel)]="lot.city" placeholder="New Delhi">
          </div>
          <div class="col-12">
            <label>Address</label>
            <input type="text" class="form-control" [(ngModel)]="lot.address" placeholder="123 Main Street">
          </div>
          <div class="col-md-5">
            <label>Latitude</label>
            <input type="number" step="0.0001" class="form-control" [(ngModel)]="lot.latitude">
          </div>
          <div class="col-md-5">
            <label>Longitude</label>
            <input type="number" step="0.0001" class="form-control" [(ngModel)]="lot.longitude">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-outline-dark w-100" (click)="useGPS()" [disabled]="locating">
              <mat-icon style="font-size:1.1rem; vertical-align:middle;">{{locating ? 'hourglass_empty' : 'gps_fixed'}}</mat-icon>
              {{locating ? '' : 'GPS'}}
            </button>
          </div>
          <div class="col-md-4">
            <label>Total Spots</label>
            <input type="number" class="form-control" [(ngModel)]="lot.totalSpots">
          </div>
          <div class="col-md-4">
            <label>Open Time</label>
            <input type="time" class="form-control" [(ngModel)]="lot.openTime">
          </div>
          <div class="col-md-4">
            <label>Close Time</label>
            <input type="time" class="form-control" [(ngModel)]="lot.closeTime">
          </div>
          <div class="col-12">
            <label>Image URL (optional)</label>
            <input type="url" class="form-control" [(ngModel)]="lot.imageUrl" placeholder="https://...">
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-dark-primary"
                  (click)="onSubmit()" [disabled]="submitting">
            {{submitting ? 'Creating...' : 'Create Lot'}}
          </button>
          <a routerLink="/manager/dashboard" class="btn btn-outline-dark">Cancel</a>
        </div>
      </div>

    </div>
  </div>
</div>
