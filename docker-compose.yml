services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: parkease-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:lts-community
    container_name: parkease-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parkease-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: parkease-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Discovery Server ──────────────────────────────────────────────────────

  eureka-server:
    build: ./eureka-server
    container_name: parkease-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Microservices ─────────────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    container_name: parkease-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_auth?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  vehicle-service:
    build: ./vehicle-service
    container_name: parkease-vehicle
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_vehicle?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  parkinglot-service:
    build: ./parkinglot-service
    container_name: parkease-parkinglot
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_parkinglot?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  spot-service:
    build: ./spot-service
    container_name: parkease-spot
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_spot?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  booking-service:
    build: ./booking-service
    container_name: parkease-booking
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_booking?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: parkease-payment
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_payment?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RABBITMQ_HOST: rabbitmq
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: parkease-notification
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      NOTIFICATION_DB_URL: jdbc:mysql://mysql:3306/parkease_notification?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      EUREKA_URL: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    container_name: parkease-analytics
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parkease_analytics?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  frontend:
    build: ./parkease-angular
    container_name: parkease-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    container_name: parkease-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy

# ── Volumes ────────────────────────────────────────────────────────────────

volumes:
  mysql-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
