server.port=8080
spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}

gateway.public-paths=/api/auth/login,/api/auth/register,/swagger-ui,/v3/api-docs,/webjars
gateway.admin-paths=/api/lots/*/approve,/api/analytics/summary,/api/analytics/report/**
gateway.manager-paths=/api/lots,/api/spots/bulk,/api/analytics/revenue/**,/api/analytics/peak-hours/**,/api/analytics/occupancy/**

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=vehicle-service
spring.cloud.gateway.routes[1].uri=lb://vehicle-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/vehicles/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=parkinglot-service
spring.cloud.gateway.routes[2].uri=lb://parkinglot-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/lots/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=spot-service
spring.cloud.gateway.routes[3].uri=lb://spot-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/spots/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].id=booking-service
spring.cloud.gateway.routes[4].uri=lb://booking-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[7].id=analytics-service
spring.cloud.gateway.routes[7].uri=lb://analytics-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/analytics/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1

# Swagger doc routes
spring.cloud.gateway.routes[8].id=auth-docs
spring.cloud.gateway.routes[8].uri=lb://auth-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/auth,/v3/api-docs

spring.cloud.gateway.routes[9].id=vehicle-docs
spring.cloud.gateway.routes[9].uri=lb://vehicle-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/vehicle
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/vehicle,/v3/api-docs

spring.cloud.gateway.routes[10].id=parkinglot-docs
spring.cloud.gateway.routes[10].uri=lb://parkinglot-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/parkinglot
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/parkinglot,/v3/api-docs

spring.cloud.gateway.routes[11].id=spot-docs
spring.cloud.gateway.routes[11].uri=lb://spot-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/v3/api-docs/spot
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/v3/api-docs/spot,/v3/api-docs

spring.cloud.gateway.routes[12].id=booking-docs
spring.cloud.gateway.routes[12].uri=lb://booking-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/v3/api-docs/booking
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/v3/api-docs/booking,/v3/api-docs

spring.cloud.gateway.routes[13].id=payment-docs
spring.cloud.gateway.routes[13].uri=lb://payment-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/v3/api-docs/payment
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/v3/api-docs/payment,/v3/api-docs

spring.cloud.gateway.routes[14].id=notification-docs
spring.cloud.gateway.routes[14].uri=lb://notification-service
spring.cloud.gateway.routes[14].predicates[0]=Path=/v3/api-docs/notification
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/v3/api-docs/notification,/v3/api-docs

spring.cloud.gateway.routes[15].id=analytics-docs
spring.cloud.gateway.routes[15].uri=lb://analytics-service
spring.cloud.gateway.routes[15].predicates[0]=Path=/v3/api-docs/analytics
spring.cloud.gateway.routes[15].filters[0]=RewritePath=/v3/api-docs/analytics,/v3/api-docs

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO

# Swagger aggregation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth
springdoc.swagger-ui.urls[1].name=vehicle-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/vehicle
springdoc.swagger-ui.urls[2].name=parkinglot-service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/parkinglot
springdoc.swagger-ui.urls[3].name=spot-service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/spot
springdoc.swagger-ui.urls[4].name=booking-service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/booking
springdoc.swagger-ui.urls[5].name=payment-service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/payment
springdoc.swagger-ui.urls[6].name=notification-service
springdoc.swagger-ui.urls[6].url=/v3/api-docs/notification
springdoc.swagger-ui.urls[7].name=analytics-service
springdoc.swagger-ui.urls[7].url=/v3/api-docs/analytics